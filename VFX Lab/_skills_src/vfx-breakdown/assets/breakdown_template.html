<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&text=__TITLETEXT__&display=swap">
<style>
/* Layout: 상단 플레이어 + 4행 타임라인, 아래는 '카드 1장 = 원리 1개' 그리드. 옵시디언 Color/Assets 도식과 같은 네이비 패널 언어. 색 판단용 단일 다크 테마. */
:root{
  color-scheme:dark;
  --bg:#0B0E14; --panel:#131822; --panel-2:#1A2030; --sunk:#0E121A;
  --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.12);
  --fg:#FFFFFF; --text:#D3D8E2; --muted:#8A91A6; --faint:#5C6478;
  --amber:#F5B841; --amber-dim:rgba(245,184,65,.15);
  --good:#10B981; --bad:#EF4444;
  --blue:#5DA8FC; --pink:#F283F9; --violet:#9B7CFF;
  --font-ui:"Inter","Noto Sans KR",system-ui,sans-serif;
  --font-kr:"Noto Sans KR","Inter",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --font-title:"Noto Serif SC","Noto Serif CJK SC",serif;
  --r:20px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-kr);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-inline:clamp(16px,3.5vw,36px);padding-block:28px 80px}
h1,h2,h3{margin:0;color:var(--fg);text-wrap:balance;line-height:1.25}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--font-ui)}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;padding-bottom:20px}
.mast .t{display:grid;gap:6px}
.kicker{font:800 11px/1 var(--font-ui);letter-spacing:.22em;color:var(--muted)}
.title{font-family:var(--font-title);font-weight:900;font-size:clamp(36px,6vw,64px);line-height:1.05;color:var(--fg);letter-spacing:.02em}
.one{font-size:16px;color:var(--text)}
.one b{color:var(--blue);font-weight:700}.one i{font-style:normal;color:var(--pink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 11.5px/1 var(--font-mono);padding:6px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* player */
.player{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.ptop{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px}
.viewer{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:var(--ar,16/9)}
.viewer canvas{display:block;width:100%;height:100%}
.burn{position:absolute;left:10px;top:10px;font:600 12px/1 var(--font-mono);color:var(--amber);background:rgba(0,0,0,.6);padding:5px 8px;border-radius:6px;pointer-events:none}
.modes{position:absolute;right:10px;bottom:10px;display:flex;background:rgba(11,14,20,.78);border-radius:8px;padding:3px;gap:2px}
.modes button{border:0;background:transparent;font:600 12px/1 var(--font-kr);padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ro{display:grid;gap:12px;align-content:start;min-width:0}
.ro-f{font:700 40px/1 var(--font-mono);color:var(--amber);font-variant-numeric:tabular-nums}
.ro-t{font:500 12px/1.4 var(--font-mono);color:var(--muted)}
.ro-beat{font:800 20px/1.2 var(--font-kr);color:var(--fg)}
.ro-note{font-size:13.5px;color:var(--muted)}
.ro-sw{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ro-sw div{display:grid;gap:4px}
.ro-sw i{display:block;height:34px;border-radius:8px;border:1px solid var(--line-2)}
.ro-sw span{font:600 10.5px/1.2 var(--font-mono);color:var(--muted)}
.meter{display:grid;gap:4px}
.meter .lab{display:flex;justify-content:space-between;font:600 10.5px/1 var(--font-mono);color:var(--muted)}
.meter .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--amber);border-radius:3px}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:7px 12px;font:600 12.5px/1 var(--font-kr);cursor:pointer;color:var(--text)}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--amber-dim);border-color:var(--amber);color:var(--amber)}
.btn.main{background:var(--fg);color:var(--bg);border-color:var(--fg);min-width:84px}
.sep{width:1px;height:20px;background:var(--line-2);margin:0 4px}
.loopflag{font:600 12px/1 var(--font-mono);color:var(--amber)}
.tl{width:100%;height:228px;display:block;cursor:ew-resize;touch-action:none;user-select:none}
.hint{font-size:12px;color:var(--faint)}

/* index */
.idx{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:22px}
.idx a{display:grid;gap:8px;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--text);align-content:start}
.idx a:hover{border-color:var(--line-2)}
.idx .ic{height:44px}.idx .ic svg{height:44px;width:auto;max-width:100%}
.idx b{font:800 14px/1.35 var(--font-kr);color:var(--fg)}
.idx span{font-size:12px;color:var(--muted);line-height:1.45}

/* sections */
.sec{margin-top:64px;display:grid;gap:16px}
.sec-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.sec-h .no{font:800 12px/1 var(--font-ui);letter-spacing:.2em;color:var(--amber)}
.sec-h h2{font:800 clamp(22px,2.6vw,28px)/1.2 var(--font-kr)}
.sec-h p{color:var(--muted);font-size:14px;flex-basis:100%}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;align-content:start;min-width:0;margin:0}
.card-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font:800 10.5px/1 var(--font-ui);letter-spacing:.14em;padding:5px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted)}
.tag.good{background:var(--good);color:#fff}.tag.bad{background:var(--bad);color:#fff}.tag.amb{background:var(--amber);color:#111}
.card h3{font:800 17px/1.3 var(--font-kr)}
.cap{font-size:13.5px;color:var(--muted);line-height:1.55}
.cap b{color:var(--text);font-weight:700}
.scroll{overflow-x:auto}
.scroll > svg{min-width:640px}
.scroll.sm > svg{min-width:0}
.th{display:block;width:100%;height:auto;border-radius:10px;background:#000;cursor:pointer}
.thl{font:600 11px/1.3 var(--font-mono);color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:6px}
.thl b{color:var(--text);font-family:var(--font-kr);font-weight:700}
.row{display:grid;gap:10px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.beats{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.beat{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;cursor:pointer;text-align:left}
.beat:hover{border-color:var(--line-2)}
.beat.cur{border-color:var(--amber)}
.beat .nm{font:700 12.5px/1.25 var(--font-kr);color:var(--fg)}
.beat .fr{font:600 10.5px/1 var(--font-mono);color:var(--muted);display:flex;justify-content:space-between}
.beat .dur{height:4px;border-radius:2px}
.lv{height:30px;border-radius:8px;margin-top:6px;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font:700 11.5px/1 var(--font-mono)}
.strip7{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.post{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.check{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.check div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;color:var(--text)}
.check svg{width:28px;height:28px}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.ex div{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;font-size:13.5px}
.ex b{font:800 13px/1.3 var(--font-kr);color:var(--amber)}
.warn{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:12px;padding:12px 14px}
details.method{margin-top:48px;color:var(--faint);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
details.method summary{cursor:pointer;color:var(--muted);font-weight:700}
details.method p{margin-top:8px;max-width:90ch}

/* mini */
.mini{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:300px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line-2);border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.55);z-index:30;display:grid}
.mini canvas{display:block;width:100%;aspect-ratio:var(--ar,16/9);background:#000}
.mini .bar{display:flex;align-items:center;gap:6px;padding:7px 8px}
.mini .tcx{flex:1;min-width:0;font:600 12px/1.2 var(--font-mono);color:var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .btn{padding:5px 9px}

@media (max-width:960px){
  #v1 .row{grid-template-columns:1fr 1fr}#v1 .row .thl{grid-column:span 2}
  .idx{grid-template-columns:repeat(3,minmax(0,1fr))}
  .c8,.c7,.c6,.c5,.c4{grid-column:span 12}
  .ptop{grid-template-columns:minmax(0,1fr)}
  .post{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:560px){
  .scroll.sm > svg{min-width:480px}
  #v1 .row{grid-template-columns:1fr 1fr}#v1 .row .thl{grid-column:span 2}
  .idx{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip7{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cols3{grid-template-columns:minmax(0,1fr)}
  .post{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mini{width:190px}
  .tl{height:210px}
}

.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.strip figure{margin:0;cursor:pointer;display:grid;gap:6px}
.strip figcaption{font-size:11.5px;color:var(--muted);line-height:1.45}
.strip figcaption b{display:block;color:var(--fg);font-size:12.5px}
.kb{font:800 10px/1 var(--font-ui);letter-spacing:.08em;padding:4px 6px;border-radius:5px;color:#fff}
.kb.good{background:var(--good)}.kb.counter{background:#6D5BD0}.kb.weak{background:var(--bad)}.kb.risk{background:#B7791F}
/* review: 총평 + 항목 카드(관찰 · 왜 · 근거 · 가져오기/개선안) */
.kb{font:800 10px/1 var(--font-ui);letter-spacing:.08em;padding:4px 6px;border-radius:5px;color:#fff;white-space:nowrap}
.kb.good{background:var(--good)}.kb.counter{background:#6D5BD0}.kb.weak{background:var(--bad)}.kb.risk{background:#B7791F}
.rno{font:800 11px/1 var(--font-mono);padding:5px 7px;border-radius:6px;color:#0B0E14;background:var(--kc);white-space:nowrap}
.vd{display:grid;gap:16px}
.vd-line{font:800 clamp(16px,1.9vw,20px)/1.5 var(--font-kr);color:var(--fg);text-wrap:pretty;max-width:62em}
.vd-cnt{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vd-cnt>span{font:700 11.5px/1 var(--font-kr);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.vd-map{overflow-x:auto;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:6px 8px}
.vd-map svg{margin:0 auto}
.vd-map .jm{cursor:pointer;outline:none}.vd-map .jm .seg{opacity:0;transition:opacity .15s}.vd-map .jm.on .seg{opacity:1}.vd-map .jm.on circle{stroke:#fff}
.vd-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.vd-col{background:var(--sunk);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;padding:14px 14px 12px;display:grid;gap:10px;align-content:start}
.vd-col h4{margin:0;font:800 14.5px/1.2 var(--font-kr);color:var(--fg);display:grid;gap:5px}
.vd-col h4 small{font:800 10px/1 var(--font-ui);letter-spacing:.14em;color:var(--c)}
.vd-col ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.vd-col li{font-size:13px;line-height:1.5;color:var(--text);display:grid;gap:3px;padding-left:10px;border-left:2px solid var(--line-2)}
.vd-col li>span{font:600 11px/1.3 var(--font-kr);color:var(--faint)}
.rv2{display:grid;gap:12px}
.rv2-h{display:flex;align-items:center;gap:8px;font:800 14px/1 var(--font-kr);color:var(--fg);margin-top:4px}
.rv2-h i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ri{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;background:var(--sunk);border:1px solid var(--line);border-left:3px solid var(--kc);border-radius:14px;padding:14px;scroll-margin-top:90px}
.ri-v{display:grid;gap:8px;align-content:start;min-width:0}
.ri-v .th{border-radius:8px}
.ri-ths{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:6px}
.ri-ths .thl{display:grid;gap:1px;margin-top:4px}.ri-ths .thl b{font-size:11px;line-height:1.3}.ri-ths .thl span{font-size:10px}
.ri-sp{background:var(--panel);border-radius:8px;padding:4px 6px}
.ri-b{display:grid;gap:12px;min-width:0;align-content:start}
.ri-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ri-h b{font:800 16px/1.35 var(--font-kr);color:var(--fg)}
.ri-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:-4px}
.ri-meta>span{display:inline-flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.ri-meta>span>em{font:800 10.5px/1 var(--font-kr);font-style:normal;color:var(--faint);letter-spacing:.04em}
.cdn{color:var(--text);font-weight:700}.cdn i{font:600 10px/1 var(--font-mono);font-style:normal;color:var(--faint);margin-left:4px}
.fj{font:inherit;color:inherit;background:none;border:0;padding:0 1px;margin:0;cursor:pointer;border-bottom:1px dashed var(--amber);border-radius:0;line-height:inherit}
.fj:hover,.fj:focus-visible{color:var(--amber);background:var(--amber-dim)}
.rref{font:inherit;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.rref:hover{color:var(--fg)}
svg .fjs{cursor:pointer}svg .fjs:hover text{fill:#fff}
.ri-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.ri-f{display:grid;gap:4px;align-content:start}
.ri-f>span,.ri-act>span{font:800 10.5px/1 var(--font-kr);letter-spacing:.06em;color:var(--muted)}
.ri-f p{font-size:13px;line-height:1.6;color:var(--text)}
.ri-f p b{color:var(--fg)}
.ri-ev{display:flex;flex-wrap:wrap;gap:6px}
.ri-ev span{font:700 12px/1 var(--font-mono);padding:7px 9px;border-radius:7px;background:var(--panel-2);color:var(--fg);display:inline-flex;gap:7px;align-items:baseline}
.ri-ev span i{font:600 11px/1 var(--font-kr);font-style:normal;color:var(--muted)}
.ri-act{border-radius:10px;padding:11px 13px;display:grid;gap:6px;background:rgba(16,185,129,.09);border:1px solid rgba(16,185,129,.28)}
.ri-act.fix{background:var(--amber-dim);border-color:rgba(245,184,65,.35)}
.ri-act.fix>span{color:var(--amber)}.ri-act.take>span{color:#5EE0B5}
.ri-act p{font:700 13.5px/1.55 var(--font-kr);color:var(--fg)}
.ri-act .chk{font:600 11px/1.45 var(--font-mono);color:var(--muted)}
@media (max-width:900px){.vd-cols{grid-template-columns:minmax(0,1fr)}.ri{grid-template-columns:minmax(0,1fr)}.ri-v{max-width:520px}}
@media (max-width:560px){.ri-g{grid-template-columns:minmax(0,1fr)}}
/* 읽는 법: 명도 · 선명도 · 색상 */
.howto{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:14px}
.ht-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.ht-h .no{font:800 11px/1 var(--font-ui);letter-spacing:.16em;color:var(--amber)}.ht-h b{font:800 16px/1.3 var(--font-kr);color:var(--fg)}.ht-h span.s{font-size:12.5px;color:var(--muted)}
.ht-g{display:grid;grid-template-columns:1.1fr 1.1fr .9fr;gap:14px}
.ht{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.ht>b{font:800 15px/1.2 var(--font-kr);color:var(--fg)}.ht>b i{font:600 11px/1 var(--font-mono);font-style:normal;color:var(--faint);margin-left:6px}
.ht p{font-size:12.5px;line-height:1.55;color:var(--text)}.ht p.n{color:var(--muted);font-size:12px}
.ht .sp{display:flex;gap:10px;flex-wrap:wrap}.ht .sp span{display:inline-flex;gap:7px;align-items:center;font:600 11.5px/1.3 var(--font-mono);color:var(--text)}.ht .sp i{width:22px;height:22px;border-radius:6px;display:inline-block;border:1px solid var(--line-2)}
.ht svg{max-width:100%}
@media (max-width:900px){.ht-g{grid-template-columns:minmax(0,1fr)}.ht svg.ring{max-width:240px;margin:0 auto}}
.hue{white-space:nowrap;cursor:help}.hue i{display:inline-block;width:.78em;height:.78em;border-radius:50%;margin:0 .22em .08em .05em;vertical-align:middle;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.huetip{position:fixed;z-index:60;width:150px;padding:10px;border-radius:14px;background:#0E121A;border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none;display:grid;gap:4px;justify-items:center}
.huetip b{font:800 13px/1.2 var(--font-kr);color:var(--fg)}.huetip span{font:600 11px/1 var(--font-mono);color:var(--muted)}
/* 투사체 해부 */
.pj{display:grid;gap:14px}
.pj-it{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:14px}
.pj-v{display:grid;gap:8px;align-content:start;min-width:0}
.pj-path{position:relative}.pj-path svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pj-b{display:grid;gap:12px;min-width:0;align-content:start}
.pj-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.pj-h b{font:800 16px/1.3 var(--font-kr);color:var(--fg)}.pj-h span{font-size:12px;color:var(--muted)}
.pj-ramp{display:grid;gap:4px}.pj-ramp .bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line-2)}
.pj-ramp .lb{display:flex;justify-content:space-between;font:600 11px/1.3 var(--font-mono);color:var(--muted)}
.pj-ramp>span{font:800 10.5px/1 var(--font-kr);color:var(--muted);letter-spacing:.04em}
.pj-time{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:600 11.5px/1.3 var(--font-mono);color:var(--text)}.pj-time i{width:26px;height:26px;border-radius:50%;display:inline-block;border:1px solid var(--line-2)}
.pj-l{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.pj-l>div{display:grid;gap:6px;align-content:start}.pj-l>div>span{font:800 11px/1 var(--font-kr);color:var(--amber);letter-spacing:.04em}
.pj-l p{font-size:12.5px;line-height:1.55;color:var(--text)}
@media (max-width:900px){.pj-it{grid-template-columns:minmax(0,1fr)}.pj-v{max-width:520px}}
@media (max-width:560px){.pj-l{grid-template-columns:minmax(0,1fr)}}
.swg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.swg div{display:grid;gap:6px}.swg i{display:block;height:56px;border-radius:10px;border:1px solid var(--line-2)}
.swg span{font:600 11px/1.4 var(--font-mono);color:var(--muted)}.swg b{font:800 12.5px/1.3 var(--font-kr);color:var(--fg)}
.title.latin{font-family:var(--font-ui);letter-spacing:-.01em}
.mot{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.motg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:960px){.lad .row{grid-template-columns:1fr 1fr}.lad .row .thl{grid-column:span 2}}
@media (max-width:560px){.mot{grid-template-columns:minmax(0,1fr)}.motg{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="t">
      <div class="kicker" id="kicker"></div>
      <h1 class="title" id="title"></h1>
      <p class="one" id="one"></p>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <section class="player" id="lab" aria-label="프레임 플레이어">
    <div class="ptop">
      <div class="viewer" id="viewer">
        <canvas id="view" aria-label="현재 프레임"></canvas>
        <div class="burn" id="burn">F1</div>
        <div class="modes" id="modes" role="group" aria-label="보기 모드">
          <button type="button" data-v="color" aria-pressed="true">컬러</button>
          <button type="button" data-v="gray" aria-pressed="false">흑백</button>
          <button type="button" data-v="band" aria-pressed="false">밸류 4단</button>
        </div>
      </div>
      <div class="ro" aria-live="polite">
        <div><div class="ro-f" id="roF">F1</div><div class="ro-t" id="roT"></div></div>
        <div><div class="ro-beat" id="roBeat"></div><div class="ro-note" id="roNote"></div></div>
        <div class="ro-sw" id="roSw"></div>
        <div class="meter"><div class="lab"><span>강도</span><span id="roE">0</span></div><div class="bar"><i id="roEBar"></i></div></div>
        <div class="meter" id="roFocWrap"><div class="lab"><span id="roFocLab">최대 명도</span><span id="roFoc">0</span></div></div>
        <button class="btn" id="roLoop" type="button">이 비트 반복</button>
      </div>
    </div>
    <div class="ctrl">
      <button class="btn main" id="play" type="button">▶ 재생</button>
      <button class="btn" id="prev" type="button" aria-label="이전 프레임">◀ 1f</button>
      <button class="btn" id="next" type="button" aria-label="다음 프레임">1f ▶</button>
      <span class="sep"></span>
      <span id="speeds" style="display:inline-flex;gap:4px">
        <button class="btn" data-v="1" type="button" aria-pressed="true">1×</button>
        <button class="btn" data-v="0.5" type="button" aria-pressed="false">½×</button>
        <button class="btn" data-v="0.25" type="button" aria-pressed="false">¼×</button>
      </span>
      <span class="loopflag" id="loopFlag" hidden></span>
      <button class="btn" id="unloop" type="button" hidden>반복 해제</button>
    </div>
    <canvas class="tl" id="tl" aria-label="타임라인. 드래그해서 프레임 이동"></canvas>
    <p class="hint">타임라인을 드래그해서 이동 · ← → 1프레임 · Space 재생 · 아래 그림의 썸네일을 누르면 이 플레이어가 그 프레임으로 간다</p>
  </section>

  <nav class="idx" id="idx" aria-label="핵심 요약"></nav>
  <section class="howto" id="howto" aria-label="숫자 읽는 법"></section>
  <div class="huetip" id="hueTip" hidden></div>
  <div id="sections"></div>

  <details class="method"><summary>측정 방법</summary><p id="method"></p></details>
</div>

<div class="mini" id="mini" hidden>
  <canvas id="miniView" aria-label="현재 프레임 미니 뷰"></canvas>
  <div class="bar"><span class="tcx" id="miniTc">F1</span><button class="btn" id="miniPlay" type="button">▶</button><button class="btn" id="miniUp" type="button" aria-label="플레이어로 이동">↑</button><button class="btn" id="miniClose" type="button" aria-label="닫기">✕</button></div>
</div>

<script>
/*SHEETS*/
const CFG=/*CONFIG*/;
const D=/*DATA*/;
// D row: [0 Lmean,1 Lp95,2 roiA_p99,3 roiB_p99,4 hCore,5 hBody,6 hEdge,7 nCore,8 nBody,9 nEdge,10 area,11 hueAll,12 energy,13 coreHex,14 bodyHex,15 edgeHex,16 sceneHex,17 p998]
const N=CFG.frames,FPS=CFG.fps,SW=CFG.sprite.w,SH=CFG.sprite.h,SCOL=CFG.sprite.cols,SPER=CFG.sprite.cols*CFG.sprite.rows;
const IMP=CFG.impact_range||[-1,-2];
const ACTS=CFG.acts, BEATS=CFG.beats;
const actOf=f=>ACTS.find(x=>f>=x.a&&f<=x.b)||ACTS[ACTS.length-1], beatOf=f=>Math.max(0,BEATS.findIndex(x=>f>=x[0]&&f<=x[1]));
const $=id=>document.getElementById(id);
const C={fg:'#FFFFFF',text:'#D3D8E2',muted:'#8A91A6',faint:'#5C6478',line:'rgba(255,255,255,.07)',line2:'rgba(255,255,255,.14)',amber:'#F5B841',good:'#10B981',bad:'#EF4444',blue:'#5DA8FC',pink:'#F283F9',violet:'#9B7CFF',sunk:'#0E121A',panel:'#131822',bg:'#0B0E14'};
const FONT='Inter,"Noto Sans KR",sans-serif',MONO='"JetBrains Mono",monospace';
document.documentElement.style.setProperty('--ar',SW+'/'+SH);
const inImp=f=>f>=IMP[0]&&f<=IMP[1];
const plateOf=f=>{for(const [p,a,b] of (CFG.plate_map||[]))if(f>=a&&f<=b)return p;return CFG.plate||1};
const ECAP=CFG.energy_cap||(()=>{const e=D.map(r=>r[12]).sort((a,b)=>a-b);return Math.max(0.5,+(e[Math.floor(e.length*0.98)]*1.15).toFixed(2))})();

// ---------- header ----------
$('kicker').textContent=CFG.kicker||('VFX BREAKDOWN · '+N+' FRAMES MEASURED');
$('title').textContent=CFG.title; if(CFG.title_latin)$('title').classList.add('latin');
$('one').innerHTML=CFG.one||'';
$('chips').innerHTML=(CFG.chips||[]).map(t=>`<span class="chip">${t}</span>`).join('');
$('method').textContent=CFG.method||'';
const hasFocus=!!CFG.focus_labels; if(!hasFocus)$('roFocWrap').hidden=true; else $('roFocLab').textContent=CFG.focus_labels.join(' / ')+' 최대 명도';

// ---------- sprite ----------
const sheets=[];const NS=Math.ceil(N/SPER);
for(let i=0;i<NS;i++){const im=new Image();im.onload=()=>renderAll();im.src=(typeof SHEETS!=='undefined'&&SHEETS.length?SHEETS[i]:'sheet'+i+'.jpg');sheets.push(im)}
const LIN=new Float32Array(256);for(let i=0;i<256;i++){const c=i/255;LIN[i]=c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)}
const ENC=new Uint8Array(4097);for(let i=0;i<=4096;i++){const y=i/4096;ENC[i]=Math.round(Math.min(1,y<=0.0031308?12.92*y:1.055*Math.pow(y,1/2.4)-0.055)*255)}
const lstar=Y=>Y>0.008856?116*Math.cbrt(Y)-16:903.3*Y;
const grayOf=L=>{const Y=L>8?Math.pow((L+16)/116,3):L/903.3;const g=ENC[Math.round(Math.min(1,Y)*4096)];return `rgb(${g},${g},${g})`};
function sprite(f){const i=f-1,s=Math.floor(i/SPER),k=i%SPER;return{img:sheets[s],x:(k%SCOL)*SW,y:Math.floor(k/SCOL)*SH}}
function draw(ctx,f,crop,dx,dy,dw,dh,mode){
  const s=sprite(Math.max(1,Math.min(N,f)));if(!s.img||!s.img.naturalWidth){ctx.fillStyle='#05070a';ctx.fillRect(dx,dy,dw,dh);return false}
  let [cx,cy,cw,ch]=crop||[0,0,SW,SH];cx=Math.max(0,Math.min(SW-1,cx));cy=Math.max(0,Math.min(SH-1,cy));cw=Math.min(cw,SW-cx);ch=Math.min(ch,SH-cy);
  ctx.drawImage(s.img,s.x+cx,s.y+cy,cw,ch,dx,dy,dw,dh);
  if(mode&&mode!=='color'){try{const id=ctx.getImageData(dx,dy,dw,dh),d=id.data;
    for(let p=0;p<d.length;p+=4){const Y=0.2126*LIN[d[p]]+0.7152*LIN[d[p+1]]+0.0722*LIN[d[p+2]];let v;
      if(mode==='gray')v=ENC[Math.round(Y*4096)];else{const L=lstar(Y);v=L>=85?240:L>=60?165:L>=35?92:28}
      d[p]=d[p+1]=d[p+2]=v}ctx.putImageData(id,dx,dy)}catch(e){}}
  return true}

// ---------- state ----------
let cur=CFG.start_frame||Math.round(N/2),playing=false,speed=1,mode='color',loop=null,acc=0,last=0;
const view=$('view'),miniView=$('miniView');view.width=miniView.width=SW;view.height=miniView.height=SH;
function renderMain(){draw(view.getContext('2d'),cur,null,0,0,SW,SH,mode);if(!$('mini').hidden)draw(miniView.getContext('2d'),cur,null,0,0,SW,SH,mode)}
function sw(hex,lab,h){return `<div><i style="background:${hex||'#0E121A'}"></i><span>${lab} ${h==null?'—':h+'°'}</span></div>`}
function setFrame(f){
  cur=Math.max(1,Math.min(N,f));renderMain();
  const r=D[cur-1],bi=beatOf(cur),b=BEATS[bi],a=actOf(cur),imp=inImp(cur);
  $('burn').textContent='F'+cur+' · '+((cur-1)/FPS).toFixed(2)+'s';
  $('roF').textContent='F'+cur;$('roT').textContent=((cur-1)/FPS).toFixed(2)+'s · '+a.name;
  $('roBeat').textContent=b[2];$('roNote').textContent=(b[3]||'')+' · F'+b[0]+(b[1]>b[0]?'–'+b[1]:'')+' ('+(b[1]-b[0]+1)+'f)';
  $('roSw').innerHTML=sw(r[13],'코어',imp?null:r[4])+sw(r[14],'바디',imp?null:r[5])+sw(r[15],'엣지',imp?null:r[6]);
  $('roE').textContent=r[12].toFixed(2)+(r[12]>ECAP?'  (상한 초과)':'');$('roEBar').style.width=Math.min(100,r[12]/ECAP*100)+'%';
  if(hasFocus)$('roFoc').textContent=(r[2]==null?'—':Math.round(r[2]))+' / '+(r[3]==null?'—':Math.round(r[3]));
  $('miniTc').textContent='F'+cur+' · '+b[2];
  document.querySelectorAll('.beat.cur').forEach(x=>x.classList.remove('cur'));
  const be=document.querySelector('.beat[data-b="'+bi+'"]');if(be)be.classList.add('cur');
  drawTL()}
function step(d){let a=loop?loop[0]:1,b=loop?loop[1]:N,n=cur+d;if(n>b)n=a;if(n<a)n=b;setFrame(n)}
function tick(t){if(!playing)return;const dt=Math.min(.1,(t-last)/1000);last=t;acc+=dt*FPS*speed;while(acc>=1){acc-=1;step(1)}requestAnimationFrame(tick)}
function setPlay(p){playing=p;$('play').textContent=p?'❚❚ 정지':'▶ 재생';$('miniPlay').textContent=p?'❚❚':'▶';if(p){last=performance.now();acc=0;requestAnimationFrame(tick)}}
function setSpeed(v){speed=+v;$('speeds').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===speed)))}
function setLoop(a,b){loop=[a,b];$('loopFlag').hidden=false;$('loopFlag').textContent='반복 F'+a+'–'+b;$('unloop').hidden=false;if(cur<a||cur>b)setFrame(a)}
function clearLoop(){loop=null;$('loopFlag').hidden=true;$('unloop').hidden=true}
function playRange(a,b){const pad=b-a<4?5:2;a=Math.max(1,a-pad);b=Math.min(N,b+pad);setLoop(a,b);setFrame(a);setSpeed(b-a<24?0.25:0.5);setPlay(true);showMini()}
function jump(f){setPlay(false);clearLoop();setFrame(f);showMini()}
$('play').onclick=()=>setPlay(!playing);$('miniPlay').onclick=()=>setPlay(!playing);
$('prev').onclick=()=>{setPlay(false);step(-1)};$('next').onclick=()=>{setPlay(false);step(1)};
$('unloop').onclick=clearLoop;$('roLoop').onclick=()=>{const b=BEATS[beatOf(cur)];playRange(b[0],b[1])};
$('speeds').querySelectorAll('button').forEach(b=>b.onclick=()=>setSpeed(b.dataset.v));
$('modes').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.v;$('modes').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderMain()});
document.addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SUMMARY')return;
  if(e.key==='ArrowRight'){setPlay(false);step(1);e.preventDefault()}else if(e.key==='ArrowLeft'){setPlay(false);step(-1);e.preventDefault()}
  else if(e.key===' '&&(tg==='BODY'||tg==='CANVAS')){setPlay(!playing);e.preventDefault()}});

// ---------- timeline ----------
const tl=$('tl');let TLW=0,TLH=0,G=84;const ROWS={thumb:[0,56],act:[62,24],core:[92,12],body:[106,16],edge:[124,12],en:[144,80]};
function sizeTL(){const r=tl.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);TLW=r.width;TLH=r.height;tl.width=Math.round(TLW*dpr);tl.height=Math.round(TLH*dpr);tl.getContext('2d').setTransform(dpr,0,0,dpr,0,0);G=TLW<560?56:84;ROWS.en=[144,Math.max(40,TLH-148)]}
function drawTL(){
  const c=tl.getContext('2d'),W=TLW-G,fx=f=>G+(f-1)/N*W,cw=W/N;c.clearRect(0,0,TLW,TLH);
  c.fillStyle=C.muted;c.font=`600 ${G<70?9.5:11}px ${FONT}`;c.textBaseline='middle';
  const lab=(t,row)=>c.fillText(t,4,row[0]+row[1]/2);lab('프레임',ROWS.thumb);lab('막 · 비트',ROWS.act);lab('코어',ROWS.core);lab('바디',ROWS.body);lab('엣지',ROWS.edge);lab('강도',ROWS.en);
  const th=ROWS.thumb[1],tw=th*SW/SH,n=Math.max(2,Math.floor(W/tw)),tww=W/n;
  for(let i=0;i<n;i++){const f=Math.round(1+(i+.5)/n*(N-1));draw(c,f,null,G+i*tww+1,0,tww-2,th,'color')}
  const [ay,ah]=ROWS.act;ACTS.forEach(a=>{const x0=fx(a.a),x1=fx(a.b+1);c.fillStyle=a.c;c.fillRect(x0,ay,x1-x0-1,ah);
    c.save();c.beginPath();c.rect(x0,ay,x1-x0-2,ah);c.clip();c.fillStyle=C.fg;c.font=`700 11px ${FONT}`;c.fillText(a.name,x0+6,ay+ah/2);c.restore()});
  c.fillStyle='rgba(11,14,20,.9)';BEATS.forEach(b=>{if(b[0]>1)c.fillRect(fx(b[0])-.5,ay+ah-6,1,6)});
  const bb=BEATS[beatOf(cur)];c.strokeStyle=C.amber;c.lineWidth=1.5;c.strokeRect(fx(bb[0])+.75,ay+.75,Math.max(2,fx(bb[1]+1)-fx(bb[0])-1.5),ah-1.5);
  const strip=(k,row)=>{for(let f=1;f<=N;f++){c.fillStyle=D[f-1][k]||'#0E121A';c.fillRect(fx(f),row[0],cw+.6,row[1])}};
  strip(13,ROWS.core);strip(14,ROWS.body);strip(15,ROWS.edge);
  const [ey,eh]=ROWS.en,cap=ECAP,yb=ey+eh;
  c.strokeStyle=C.line;c.lineWidth=1;[.25,.5,.75].forEach(v=>{const y=yb-v*(eh-12);c.beginPath();c.moveTo(G,y);c.lineTo(TLW,y);c.stroke()});
  for(let f=1;f<=N;f++){const r=D[f-1];const h=Math.min(cap,r[12])/cap*(eh-12);c.fillStyle=inImp(f)?'#E8E6F0':(r[14]||r[15]||'#3A4150');c.fillRect(fx(f),yb-h,Math.max(1,cw-.3),h)}
  c.font=`600 9.5px ${MONO}`;c.textAlign='center';let lastX=-99;
  (CFG.peak_marks||[]).forEach(([f])=>{const x=fx(f)+cw/2,v=Math.min(cap,D[f-1][12]),y=yb-v/cap*(eh-12)-4;if(x-lastX<30)return;lastX=x;const over=D[f-1][12]>cap;c.fillStyle=over?C.amber:C.text;c.fillText(over?f+'↑':String(f),x,Math.max(ey+6,y-2))});
  c.textAlign='left';const px=fx(cur)+cw/2;c.fillStyle=C.amber;c.fillRect(px-.75,0,1.5,TLH);c.beginPath();c.moveTo(px-5,0);c.lineTo(px+5,0);c.lineTo(px,6);c.fill()}
let drag=false;function scrub(e){const r=tl.getBoundingClientRect();setFrame(Math.max(1,Math.min(N,Math.floor((e.clientX-r.left-G)/(r.width-G)*N)+1)))}
tl.addEventListener('pointerdown',e=>{drag=true;setPlay(false);tl.setPointerCapture(e.pointerId);scrub(e)});tl.addEventListener('pointermove',e=>{if(drag)scrub(e)});
tl.addEventListener('pointerup',()=>drag=false);tl.addEventListener('pointercancel',()=>drag=false);

// ---------- thumbs ----------
function renderThumbs(){document.querySelectorAll('canvas.th[data-f]').forEach(cv=>{const f=+cv.dataset.f,cr=(cv.dataset.crop||`0,0,${SW},${SH}`).split(',').map(Number);
  const sc=Math.min(2,640/cr[2]);cv.width=Math.round(cr[2]*sc);cv.height=Math.round(cr[3]*sc);draw(cv.getContext('2d'),f,cr,0,0,cv.width,cv.height,cv.dataset.mode||'color');
  if(!cv.dataset.bound&&!cv.closest('.beat')){cv.dataset.bound=1;cv.addEventListener('click',()=>jump(f))}})}
const lateDraw=[];function renderAll(){renderMain();renderThumbs();drawTL();lateDraw.forEach(fn=>fn())}

// ---------- svg helpers ----------
function T(x,y,s,o={}){return `<text x="${x}" y="${y}" fill="${o.fill||C.muted}" font-size="${o.size||11}" font-weight="${o.w||600}" text-anchor="${o.anchor||'start'}" ${o.mono?`font-family='${MONO}'`:''}>${s}</text>`}
function R(x,y,w,h,fill,o={}){return `<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${h}" rx="${o.rx||0}" fill="${fill}" ${o.stroke?`stroke="${o.stroke}" stroke-width="${o.sw||1}"`:''} ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`}
function L(x1,y1,x2,y2,stroke,o={}){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${o.w||1}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`}
const hsl=(h,s,l)=>`hsl(${h},${s}%,${l}%)`;
const svgEl=(vb,inner,cls)=>`<svg viewBox="${vb}" role="img">${inner}</svg>`;
const thumb=(f,crop,mode,extra)=>`<canvas class="th" data-f="${f}" ${crop?`data-crop="${crop}"`:''} ${mode?`data-mode="${mode}"`:''} ${extra||''}></canvas>`;

// ---------- index icons ----------
const ICON={
 ladder:`<svg viewBox="0 0 120 44">${[[8,'#99f9ff','#ffdbff'],[18,'#5da8fc','#f283f9'],[29,'#465a93','#745388'],[36,'#384c76','#4d4569']].map(([y,a,b])=>R(10,y,30,6,a,{rx:2})+L(42,y+3,78,y+3,C.line2,{dash:'2 3'})+R(80,y,30,6,b,{rx:2})).join('')}</svg>`,
 conv:`<svg viewBox="0 0 120 44"><circle cx="60" cy="36" r="5" fill="#4b5878"/>${L(14,6,56,33,C.blue,{w:2})}${L(106,6,64,33,C.pink,{w:2})}<circle cx="14" cy="6" r="4" fill="#99f9ff"/><circle cx="106" cy="6" r="4" fill="#ffdbff"/></svg>`,

    <p class="n">색 선택기의 <b>HSV S</b>(Saturation, 채도)와는 다르다. HSV S가 높아도 덜 진해 보이는 색이 있다.</p>
    <div class="sp">${ex.map(it=>{const [,cc]=hexLab(it.hex);return `<span><i style="background:${it.hex}"></i>${it.label} · HSV S ${hexS(it.hex)} · 선명도 ${Math.round(cc)}</span>`}).join('')}</div></div>
   <div class="ht"><b>색상<i>0–360°</i></b><p>색상환 위의 위치. 글 속 각도 앞의 <b>색 점</b>이 그 색이고, 마우스를 올리면 색상환에서 위치가 보인다.</p>${ringSVG(230,keys.map(([h])=>[h]),{names:1,pad:34,w:12,mr:7})}${keys.length?`<div class="sp">${keys.map(([h,lab])=>`<span><i style="background:${hueCol(h)};border-radius:50%;width:14px;height:14px"></i>${lab} ${h}°</span>`).join('')}</div>`:''}</div>
  </div>`})();
// 글 속 "215°" 앞에 색 점. "81° 회전", "+81°" 같은 차이 각도는 그대로 둔다.
(function(){const re=/(\d{1,3})°/g;
  [$('idx'),$('sections')].filter(Boolean).forEach(root=>{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest('svg,canvas,script,style,.hue,.ht,.strip7 .thl,[data-nohue]'))return NodeFilter.FILTER_REJECT;re.lastIndex=0;return re.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP}});
    const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
    nodes.forEach(n=>{const t=n.nodeValue,frag=document.createDocumentFragment();let last=0,m,hit=0;re.lastIndex=0;
      while((m=re.exec(t))){const h=+m[1],pre=t.slice(Math.max(0,m.index-1),m.index),post=t.slice(m.index+m[0].length,m.index+m[0].length+4);
        if(h>360||/[+\-−±]/.test(pre)||/^\s*(회전|돌|돈|차이|넘|이상|이내|안팎|움직|만큼)/.test(post))continue;
        frag.append(t.slice(last,m.index));const sp=document.createElement('span');sp.className='hue';sp.dataset.h=h;sp.title='';if(!p_inA(n))sp.tabIndex=0;
        sp.innerHTML=`<i style="background:${hueCol(h)}"></i>${m[0]}`;frag.append(sp);last=m.index+m[0].length;hit=1}
      if(hit){frag.append(t.slice(last));n.replaceWith(frag)}})})
  function p_inA(n){return !!(n.parentElement&&n.parentElement.closest('a'))}
  const tip=$('hueTip');const show=el=>{const h=+el.dataset.h;tip.innerHTML=ringSVG(130,[[h]],{pad:14,w:10,mr:8,center:h+'°',cs:15})+`<b>${hueName(h)}</b><span>색상 ${h}°</span>`;tip.hidden=false;
    const r=el.getBoundingClientRect(),tw=150,th=tip.offsetHeight||200;let x=r.left+r.width/2-tw/2,y=r.top-th-8;if(y<8)y=r.bottom+8;tip.style.left=Math.max(8,Math.min(innerWidth-tw-8,x))+'px';tip.style.top=y+'px'};
  const hide=()=>{tip.hidden=true};
  // 포인터가 색상 칩 위에 있을 때만 보인다. 칩을 벗어나거나, 창 밖으로 나가거나, 스크롤·클릭하면 닫힌다.
  let curHue=null;const set=el=>{if(el===curHue)return;curHue=el;el?show(el):hide()};
  document.addEventListener('pointermove',e=>set(e.target.closest?e.target.closest('.hue'):null),{passive:true});
  document.addEventListener('pointerleave',()=>set(null));document.documentElement.addEventListener('mouseleave',()=>set(null));
  document.addEventListener('pointerdown',e=>{if(!(e.target.closest&&e.target.closest('.hue')))set(null)});
  document.addEventListener('focusin',e=>{const h=e.target.closest&&e.target.closest('.hue');if(h&&h.matches(':focus-visible'))set(h)});
  document.addEventListener('focusout',()=>set(null));
  addEventListener('scroll',()=>set(null),{passive:true});addEventListener('blur',()=>set(null))})();

// ---------- 프레임 링크: 글 속 F123, F40–46을 누르면 그 프레임(구간은 반복 재생)으로 ----------
(function linkFrames(){const re=/F(\d{1,4})(?:\s*[–-]\s*F?(\d{1,4}))?(?!\d)/g;
  [$('idx'),$('sections')].filter(Boolean).forEach(root=>{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest('svg,button,canvas,script,style,.fj,a'))return NodeFilter.FILTER_REJECT;re.lastIndex=0;return re.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP}});
    const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
    nodes.forEach(n=>{const t=n.nodeValue,frag=document.createDocumentFragment();let last=0,m;re.lastIndex=0;
      while((m=re.exec(t))){const a=+m[1],b=m[2]?+m[2]:a;if(a<1||a>N||b<a||b>N)continue;frag.append(t.slice(last,m.index));
        const bt=document.createElement('button');bt.className='fj';bt.dataset.jf=b>a?a+'-'+b:String(a);bt.title=b>a?`F${a}–${b} 반복 재생`:`F${a} 보기`;bt.textContent=m[0];frag.append(bt);last=m.index+m[0].length}
      frag.append(t.slice(last));n.replaceWith(frag)})})})();
document.addEventListener('click',e=>{const j=e.target.closest('[data-jf]');if(j){e.preventDefault();e.stopPropagation();miniDismissed=false;const [a,b]=j.dataset.jf.split('-').map(Number);b?playRange(a,b):jump(a);return}
  const r=e.target.closest('.rref[data-to]');if(r){const t=document.getElementById(r.dataset.to);if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}},true);

// ---------- mini ----------
let labVisible=true,miniDismissed=false;
function showMini(){if(!labVisible&&!miniDismissed){$('mini').hidden=false;renderMain()}}
new IntersectionObserver(es=>es.forEach(en=>{labVisible=en.isIntersecting;if(labVisible){$('mini').hidden=true;miniDismissed=false}else if(!miniDismissed){$('mini').hidden=false;renderMain()}}),{threshold:.1}).observe($('viewer'));
$('miniClose').onclick=()=>{miniDismissed=true;$('mini').hidden=true};
$('miniUp').onclick=()=>$('lab').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});

sizeTL();window.addEventListener('resize',()=>{sizeTL();drawTL()});setFrame(cur);renderThumbs();
// 주소 끝 #f=154 또는 #f=40-46 으로 열면 그 프레임(구간 반복)에서 시작한다. 옵시디언 노트에서 프레임으로 바로 연결할 때 쓴다.
(function(){const h=(location.hash||'').match(/f=(\d+)(?:-(\d+))?/);if(!h)return;const a=Math.min(N,Math.max(1,+h[1])),b=h[2]?Math.min(N,+h[2]):0;setTimeout(()=>{b>a?playRange(a,b):jump(a)},50)})();
</script>
